name: ClaimSure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insurance_fraud_db
          POSTGRES_USER: claimsure
          POSTGRES_PASSWORD: claimsure-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsure -d insurance_fraud_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/insurance_fraud_db
      DB_USERNAME: claimsure
      DB_PASSWORD: claimsure-ci-password
      JWT_SECRET: Q2xhaW1TdXJlLUNJLW9ubHktc2VjcmV0LWtleS0zMi1ieXRlcyE=
      JWT_EXPIRATION_MS: 3600000
      S3_ENABLED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: insurance-fraud-backend
        run: mvn -B test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: insurance-fraud-frontend/package-lock.json

      - name: Install dependencies
        working-directory: insurance-fraud-frontend
        run: npm ci

      - name: Build frontend
        working-directory: insurance-fraud-frontend
        run: npm run build

  etl:
    name: ETL Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ETL Docker image
        run: docker build -t claimsure-etl:ci ./insurance-fraud-etl

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - etl

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy application through SSM
        shell: bash
        env:
          INSTANCE_ID: i-056949dcc6590fee2
        run: |
          set -Eeuo pipefail

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ClaimSure deployment ${GITHUB_SHA}" \
            --parameters '{
              "commands": [
                "set -Eeuo pipefail",
                "cd /home/ubuntu/ClaimSure",
                "git fetch origin main",
                "git pull --ff-only origin main",
                "docker compose -f compose.yaml -f compose.ec2.yaml up -d --build backend frontend",
                "docker compose -f compose.yaml -f compose.ec2.yaml ps"
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" || \
                  "$STATUS" == "TimedOut" || \
                  "$STATUS" == "Cancelled" || \
                  "$STATUS" == "Cancelling" ]]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json

              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the deployment command."
          exit 1
